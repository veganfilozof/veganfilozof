media:
  input: media
  output: /media

content:
  - name: posts
    label: Yazılar
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"

    fields:
      - name: title
        label: Başlık
        type: string
        required: true

      - name: date
        label: Tarih
        type: date
        required: true

      - name: image
        label: Kapak Fotoğrafı
        type: image
        required: false

      - name: body
        label: Yazı
        type: rich-text
        required: true